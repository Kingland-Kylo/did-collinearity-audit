name: Reproduce audit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python data/download.py
      - run: python -m unittest discover -s tests -v
      - run: python code/01_replicate.py
      - run: python code/02_diagnose.py
      - run: python code/03_robustness.py
      - run: python -m ipykernel install --user --name python3
      - run: python -m jupyter nbconvert --execute --to notebook --ExecutePreprocessor.timeout=600 --output audit.executed.ipynb --output-dir output notebooks/audit.ipynb
        env:
          MPLBACKEND: module://matplotlib_inline.backend_inline
